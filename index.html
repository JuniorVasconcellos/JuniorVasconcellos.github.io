<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <style>
    :root { --bg: #0f172a; --fg: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 30% 20%, #1e293b, var(--bg));
      color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; }
    p { color: var(--muted); margin-top: 12px; font-size: 1.1rem; }
    .dot { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Coming soon<span class="dot">.</span></h1>
    <p>Something great is on the way.</p>
  </main>
</body>
</html>
